quarkus.application.name=hato-be
quarkus.http.port=${HTTP_PORT:8080}
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/q/openapi

quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.time-zone=America/La_Paz
quarkus.resteasy-reactive.use-method-annotations=true

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Requested-With,X-Operation-Id
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.exposed-headers=Location,Link
quarkus.http.cors.access-control-max-age=24H

quarkus.http.auth.permission.public.paths=/q/health/*,/q/metrics,/q/openapi,/q/openapi*,/q/swagger-ui/*,/api/auth/*,/api/admin/bootstrap
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.proactive=true

mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=bo.pasorapa.hato
smallrye.jwt.sign.key.location=keys/privateKey.pem

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5434/hato}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASS:postgres}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:20}
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN_SIZE:2}

quarkus.hibernate-orm.packages=bo.pasorapa.hato.domain
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.mapping.format.global=ignore

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.validate-on-migrate=true
quarkus.liquibase.change-log=db/changelog/master.yaml

quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.json=false
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

auth.legacy-token-enabled=${AUTH_LEGACY_TOKEN_ENABLED:false}
