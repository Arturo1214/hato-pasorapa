              - column: { name: entry_id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: animal_uuid, type: UUID, constraints: { nullable: false } }
              - column: { name: lot_id, type: UUID, constraints: { nullable: false } }
              - column: { name: period_key, type: VARCHAR(7), constraints: { nullable: false } }
              - column: { name: metric_type, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: metric_value, type: "DECIMAL(14,2)", constraints: { nullable: false } }
              - column: { name: identity_key, type: VARCHAR(220), constraints: { nullable: false, unique: true } }
              - column: { name: operation_id, type: UUID, constraints: { nullable: false, unique: true } }
