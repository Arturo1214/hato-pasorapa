databaseChangeLog:
  - changeSet:
      id: 017-admin-reporting-indexes-v1
      author: opencode
      changes:
        - createIndex:
            tableName: animals
            indexName: idx_animals_owner_report
            columns:
              - column:
                  name: owner_ganadero_id
              - column:
                  name: active
              - column:
                  name: category
              - column:
                  name: sex
        - createIndex:
            tableName: animal_health_events
            indexName: idx_animal_health_events_report_filters
            columns:
              - column:
                  name: occurred_at
              - column:
                  name: health_event_type
              - column:
                  name: animal_uuid
        - createIndex:
            tableName: admin_notifications
            indexName: idx_admin_notifications_published_id
            columns:
              - column:
                  name: published_at
              - column:
                  name: id
