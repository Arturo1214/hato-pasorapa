databaseChangeLog:
  - changeSet:
      id: 018-animal-breed-catalog-v1
      author: opencode
      changes:
        - createTable:
            tableName: razas
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: nombre
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: nombre_normalizado
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: descripcion
                  type: VARCHAR(500)
              - column:
                  name: origen
                  type: VARCHAR(120)
              - column:
                  name: tipo
                  type: VARCHAR(30)
                  defaultValue: UNCLASSIFIED
                  constraints:
                    nullable: false
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: razas
            indexName: idx_razas_activo_sort
            columns:
              - column:
                  name: activo
              - column:
                  name: sort_order
              - column:
                  name: nombre
        - insert:
            tableName: razas
            columns:
