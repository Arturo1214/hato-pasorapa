databaseChangeLog:
  - changeSet:
      id: 015-animal-category-workflow-v2
      author: openai
      validCheckSum: ANY
      changes:
        - sql:
            sql: |
              UPDATE animals
              SET category = CASE
                WHEN category = 'COW' THEN 'VACA'
                WHEN category = 'BULL' THEN 'TORO'
                WHEN category = 'HEIFER' THEN 'VAQUILLONA'
                WHEN category = 'CALF' AND sex = 'HEMBRA' THEN 'TERNERA'
                WHEN category = 'CALF' THEN 'TERNERO'
                ELSE category
              END;
        - sql:
            dbms: postgresql
            sql: |
              UPDATE animals
              SET birth_date = (admission_date - INTERVAL '6' MONTH)::date
              WHERE category = 'TERNERO'
                AND birth_date IS NULL
                AND admission_date IS NOT NULL;
        - sql:
            dbms: h2
            sql: |
              UPDATE animals
              SET birth_date = CAST(DATEADD('MONTH', -6, admission_date) AS DATE)
              WHERE category = 'TERNERO'
                AND birth_date IS NULL
                AND admission_date IS NOT NULL;
