        - createTable:
            tableName: herd_lot_assignments
            columns:
              - column: { name: assignment_id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: animal_uuid, type: UUID, constraints: { nullable: false } }
              - column: { name: lot_id, type: UUID, constraints: { nullable: false } }
              - column: { name: from_date, type: DATE, constraints: { nullable: false } }
              - column: { name: to_date, type: DATE }
              - column: { name: operation_id, type: UUID, constraints: { nullable: false, unique: true } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
