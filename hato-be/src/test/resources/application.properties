quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:hato;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.validate-on-migrate=true
auth.legacy-token-enabled=false
hato.storage.animal-images.enabled=true
hato.storage.animal-images.root-dir=${java.io.tmpdir}/hato-test-animal-images
hato.storage.animal-images.max-bytes=2097152
hato.storage.animal-images.mime-allowlist=image/jpeg,image/png
