        - createTable:
            tableName: herd_cost_ledger
            columns:
              - column: { name: entry_id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: lot_id, type: UUID, constraints: { nullable: false } }
              - column: { name: period_key, type: VARCHAR(7), constraints: { nullable: false } }
              - column: { name: category, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: source, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: amount, type: "DECIMAL(14,2)", constraints: { nullable: false } }
