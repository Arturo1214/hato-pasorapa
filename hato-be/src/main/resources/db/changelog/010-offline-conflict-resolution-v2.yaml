databaseChangeLog:
  - changeSet:
      id: 010-offline-conflict-resolution-v2
      author: openai
      changes:
        - addColumn:
            tableName: sync_operation_receipts
            columns:
              - column:
                  name: operation_type
                  type: VARCHAR(40)
              - column:
                  name: payload_json
                  type: CLOB
        - createIndex:
            tableName: sync_operation_receipts
            indexName: idx_sync_operation_receipts_operation_type
            columns:
              - column:
                  name: operation_type
        - createTable:
            tableName: sync_conflict_audit_ledger
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: operation_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: operation_type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: decision
                  type: VARCHAR(40)
              - column:
                  name: result_status
                  type: VARCHAR(40)
              - column:
                  name: reason
                  type: VARCHAR(500)
              - column:
                  name: actor_user_id
                  type: UUID
              - column:
                  name: policy_key
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: retention_expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: sync_conflict_audit_ledger
            indexName: idx_sync_conflict_audit_ledger_operation
            columns:
              - column:
                  name: operation_id
              - column:
                  name: created_at
        - createIndex:
            tableName: sync_conflict_audit_ledger
            indexName: idx_sync_conflict_audit_ledger_retention
            columns:
              - column:
                  name: retention_expires_at
